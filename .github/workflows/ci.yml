name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install numpy matplotlib

      - name: Python tests
        run: python -m unittest test_raytracing -v

      - name: Generate raytracing binaries
        run: |
          python generate_raytracing.py --per-pair
          python generate_raytracing.py

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: C++ unit tests (+ loader vs Python binary)
        run: ./build/unit_tests output_per_pair/raytracing_result.bin output/raytracing_result.bin

      - name: Run Doppler PoC
        run: ./build/poc_doppler --binary output_per_pair/raytracing_result.bin --speed-kmh 60 --direction-deg 45 --time-ms 1 --num-dominant 3

      - name: Run N sweep (method 2) at 0/60/120 km/h
        run: |
          for v in 0 60 120; do
            ./build/poc_doppler --binary output_per_pair/raytracing_result.bin \
              --speed-kmh $v --direction-deg 45 --time-ms 1 --sweep-max 10 \
              --out-csv nmse_sweep_v${v}.csv
          done

      - name: Plot sweep curves
        run: |
          for v in 0 60 120; do
            python plot_sweep.py nmse_sweep_v${v}.csv nmse_sweep_v${v}.png "UE speed ${v} km/h"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: doppler-results
          path: |
            doppler_comparison.csv
            nmse_sweep_v*.csv
            nmse_sweep_v*.png
