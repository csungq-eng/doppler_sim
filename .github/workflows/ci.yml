name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install numpy matplotlib

      - name: Python tests
        run: python -m unittest test_raytracing -v

      - name: Generate raytracing binaries (random + geometric)
        run: |
          python generate_raytracing.py --per-pair
          python generate_raytracing.py
          python generate_raytracing.py --geometric --per-pair

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: C++ unit tests (+ loader vs Python binaries)
        run: ./build/unit_tests output_per_pair/raytracing_result.bin output/raytracing_result.bin output_geo_per_pair/raytracing_result.bin

      - name: Run Doppler PoC (random)
        run: ./build/poc_doppler --binary output_per_pair/raytracing_result.bin --speed-kmh 60 --direction-deg 45 --time-ms 1 --num-dominant 3

      - name: Run Doppler PoC (geometric)
        run: ./build/poc_doppler --binary output_geo_per_pair/raytracing_result.bin --speed-kmh 60 --direction-deg 45 --time-ms 1 --num-dominant 3 --out-csv doppler_comparison_geo.csv

      - name: Run N sweep (method 2) at 0/60/120 km/h, random + geometric
        run: |
          for v in 0 60 120; do
            ./build/poc_doppler --binary output_per_pair/raytracing_result.bin \
              --speed-kmh $v --direction-deg 45 --time-ms 1 --sweep-max 16 \
              --out-csv nmse_sweep_v${v}.csv
            ./build/poc_doppler --binary output_geo_per_pair/raytracing_result.bin \
              --speed-kmh $v --direction-deg 45 --time-ms 1 --sweep-max 16 \
              --out-csv nmse_sweep_geo_v${v}.csv
          done
          ./build/poc_doppler --binary output_geo_per_pair/raytracing_result.bin \
            --speed-kmh 60 --direction-deg 45 --time-ms 1 --sweep-max 16 --renorm-dominant \
            --out-csv nmse_sweep_geo_v60_renorm.csv

      - name: Plot sweep curves
        run: |
          for v in 0 60 120; do
            python plot_sweep.py nmse_sweep_v${v}.csv nmse_sweep_v${v}.png "random data, UE speed ${v} km/h"
            python plot_sweep.py nmse_sweep_geo_v${v}.csv nmse_sweep_geo_v${v}.png "geometric (ray-tracing-like) data, UE speed ${v} km/h"
          done

      - name: Symbol sweep (time evolution, geometric) at 5/30/60/120 km/h
        run: |
          for v in 5 30 60 120; do
            ./build/poc_doppler --binary output_geo_per_pair/raytracing_result.bin \
              --speed-kmh $v --direction-deg 45 --num-dominant 3 \
              --symbol-list 0,1,2,4,7,10,14,28,56,140,280 \
              --out-csv symbol_sweep_geo_v${v}.csv
          done
          ./build/poc_doppler --binary output_geo_per_pair/raytracing_result.bin \
            --speed-kmh 60 --direction-deg 45 --num-dominant 3 --renorm-dominant \
            --symbol-list 0,1,2,4,7,10,14,28,56,140,280 \
            --out-csv symbol_sweep_geo_v60_renorm.csv

      - name: Plot symbol sweep
        run: |
          for v in 60 120; do
            python plot_symbol_sweep.py symbol_sweep_geo_v${v}.csv symbol_sweep_geo_v${v}.png "geometric data, UE speed ${v} km/h, method 2 N=3"
          done
          python plot_symbol_sweep.py symbol_sweep_geo_v60_renorm.csv symbol_sweep_geo_v60_renorm.png "geometric data, UE speed 60 km/h, method 2 N=3 renormalized"

      - name: Plot narrowband RSRP figures (method 3 vs symbol delay, method 2 vs path count)
        run: |
          python plot_rsrp_figures.py \
            --symbol-csv symbol_sweep_geo_v5.csv:5,symbol_sweep_geo_v30.csv:30,symbol_sweep_geo_v60.csv:60 \
            --symbols 1,2,4,7,10,14,28,56,140,280 \
            --sweep-csv nmse_sweep_geo_v60.csv \
            --remap 16:12,12:8,8:6,6:4,4:2,2:1

      - name: LOS / NLOS split (geometric)
        run: |
          for v in 0 60 120; do
            echo "== UE speed ${v} km/h"
            python summarize_los_split.py nmse_sweep_geo_v${v}_grid.csv \
              output_geo_per_pair/config.json los_split_geo_v${v}.md
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: doppler-results
          path: |
            doppler_comparison*.csv
            nmse_sweep_*.csv
            nmse_sweep_*.png
            symbol_sweep_*.csv
            symbol_sweep_*.png
            rsrp_band_*.png
            method2_vs_paths.csv
            los_split_*.md
